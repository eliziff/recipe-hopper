<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Breakfast · Recipe Hopper</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/recipe-hopper/static/css/output.css">
  <link rel="stylesheet" href="/recipe-hopper/static/css/custom-styles.css">
</head>
<body class="bg-gray-50">
  <main class="breakfast-page">
    <a class="portion-back breakfast-back" id="back" href="/recipe-hopper/planner.html">← Back to weekly plan</a>
    <header>
      <p class="eyebrow" id="day">Breakfast · 1 adult portion</p>
      <span class="breakfast-difficulty" id="difficulty">Easy</span>
      <span class="breakfast-skill" id="breakfast-skill" hidden></span>
      <h1 id="title"></h1>
      <p>Cook fresh in the morning. These quantities feed one adult.</p>
    </header>
    <div class="breakfast-recipe-grid">
      <section>
        <h2>Ingredients</h2>
        <ul id="ingredients"></ul>
      </section>
      <section>
        <h2>Method</h2>
        <p id="method"></p>
      </section>
    </div>
    <details class="technique-lesson breakfast-technique" id="technique-guide" open hidden>
      <summary>
        <span>Technique guide</span>
        <strong id="guide-title"></strong>
      </summary>
      <div class="lesson-content">
        <p class="lesson-principle" id="guide-principle"></p>
        <div>
          <h3>Method</h3>
          <ol id="guide-steps"></ol>
        </div>
        <aside class="lesson-notes">
          <h3>Look for</h3>
          <p id="guide-cue"></p>
          <h3>Common mistake</h3>
          <p id="guide-mistake"></p>
        </aside>
        <p class="lesson-sources" id="guide-sources"></p>
      </div>
    </details>
  </main>
  <script src="/recipe-hopper/static/js/curriculum.js"></script>
  <script src="/recipe-hopper/static/js/breakfast-data.js"></script>
  <script>
    (() => {
      const {
        WEEK_COUNT,
        breakfastReviewWeeks,
        breakfastPracticeForWeek
      } = window.RECIPE_HOPPER_CURRICULUM;
      const {forPlan, resolvePlan, defaultForWeek, lesson, method} = window.RECIPE_HOPPER_BREAKFASTS;
      const params = new URLSearchParams(location.search);
      const week = Math.min(WEEK_COUNT, Math.max(1, Number(params.get("week")) || 1));
      const dayIndex = Math.min(6, Math.max(0, Number(params.get("day")) || 0));
      const plan = resolvePlan(params.get("plan"), week) || defaultForWeek(week);
      const breakfast = forPlan(plan)[dayIndex];
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const number = value => new Intl.NumberFormat("en-CA", {maximumFractionDigits: 2}).format(value);
      const escapeHTML = value => value.replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
      const ingredientLabel = value => value.charAt(0).toUpperCase() + value.slice(1);
      document.title = `${breakfast.meal} · Recipe Hopper`;
      document.getElementById("back").href = `/recipe-hopper/planner.html?week=${week}`;
      document.getElementById("back").textContent = `← Back to Week ${week}`;
      document.getElementById("day").textContent = `${days[dayIndex]} breakfast · ${breakfast.difficulty} · 1 adult portion`;
      const difficulty = document.getElementById("difficulty");
      difficulty.textContent = breakfast.difficulty;
      difficulty.classList.toggle("is-hard", breakfast.difficulty === "Hard");
      const breakfastSkill = document.getElementById("breakfast-skill");
      breakfastSkill.hidden = !breakfast.skill;
      const practice = breakfast.skill ? breakfastPracticeForWeek(week) : null;
      const review = practice
        ? practice.stage
          ? `Review ${practice.stage} of ${breakfastReviewWeeks.length - 1} · last Week ${practice.previousWeek}`
          : `New · next Week ${practice.nextWeek}`
        : "";
      breakfastSkill.textContent = breakfast.skill
        ? `Technique · ${breakfast.skill.replace(/\b\w/g, letter => letter.toUpperCase())}${review ? ` · ${review}` : ""}`
        : "";
      document.getElementById("title").textContent = breakfast.meal;
      document.getElementById("ingredients").innerHTML = breakfast.ingredients.map(ingredient =>
        `<li><span>${escapeHTML(ingredientLabel(ingredient[0]))}</span><strong>${number(ingredient[1])}${ingredient[2] ? ` ${escapeHTML(ingredient[2])}` : ""}</strong></li>`
      ).join("");
      document.getElementById("method").textContent = method(breakfast);
      const guide = document.getElementById("technique-guide");
      guide.hidden = !breakfast.skill;
      if (breakfast.skill) {
        document.getElementById("guide-title").textContent = lesson.name.replace(/\b\w/g, letter => letter.toUpperCase());
        document.getElementById("guide-principle").textContent = lesson.principle;
        document.getElementById("guide-steps").innerHTML = lesson.steps
          .map(step => `<li>${escapeHTML(step)}</li>`)
          .join("");
        document.getElementById("guide-cue").textContent = lesson.cue;
        document.getElementById("guide-mistake").textContent = lesson.mistake;
        document.getElementById("guide-sources").innerHTML = lesson.sources
          .map(([label, url]) => `<a href="${escapeHTML(url)}" target="_blank" rel="noreferrer">${escapeHTML(label)}</a>`)
          .join(" · ");
      }
    })();
  </script>
</body>
</html>
