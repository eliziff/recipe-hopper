name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Install CookCLI
        run: |
          curl -fsSL https://github.com/cooklang/CookCLI/releases/download/v0.32.1/cook-x86_64-unknown-linux-gnu.tar.gz -o "${RUNNER_TEMP}/cook.tar.gz"
          tar -xzf "${RUNNER_TEMP}/cook.tar.gz" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/cook"
      - name: Build
        run: python3 build_site.py --cook "${RUNNER_TEMP}/cook"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
