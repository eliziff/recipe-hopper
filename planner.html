<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weekly Meal Plan</title>
  <link rel="stylesheet" href="/recipe-hopper/static/css/output.css">
  <link rel="stylesheet" href="/recipe-hopper/static/css/custom-styles.css">
</head>
<body class="bg-gray-50">
  <main class="planner-shell mx-auto px-4">
    <header class="planner-header">
      <a href="/recipe-hopper/">← Recipe library</a>
      <p class="eyebrow" id="cycle">Choose a week · 1 of 8</p>
      <h1>Weekly plan</h1>
      <nav class="cycle-progress" id="cycle-progress" aria-label="Choose a week"></nav>
    </header>

    <section class="planner-controls grid gap-4 bg-white border border-gray-200 rounded-xl" aria-label="Plan settings">
      <label><span>Breakfast rotation</span><select id="breakfast-plan"></select></label>
      <label><span>Easy recipe</span><select id="meal-a"></select></label>
      <label><span>Skill recipe</span><select id="meal-b"></select></label>
      <button class="reroll-button" id="reroll" type="button">New pairing</button>
    </section>

    <section class="prep-summary bg-white border border-gray-200 rounded-xl" aria-live="polite">
      <div><span>Technique</span><strong id="skill"></strong></div>
      <p class="batch-note" id="batch-note"></p>
    </section>
    <section class="week-grid" id="week" aria-label="One-week meal calendar"></section>

    <section class="grocery-panel bg-white border border-gray-200 rounded-xl">
      <header class="grocery-header">
        <div>
          <p class="eyebrow">Sunday · one trip</p>
          <h2>Grocery list</h2>
          <p class="pantry-note">On hand: salt, sugar, flour, bread flour, water, mayonnaise, black pepper and cooking oils.</p>
        </div>
        <div class="grocery-meta">
        <p class="grocery-progress" id="grocery-progress" aria-live="polite"></p>
        <div class="grocery-actions">
          <button id="copy-groceries" type="button">Copy list</button>
          <button id="clear-groceries" type="button">Clear checks</button>
        </div>
      </div>
      </header>
      <div class="grocery-groups" id="groceries"></div>
    </section>
  </main>
  <script>
    const root = "/recipe-hopper/";
    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const clampWeek = value => Math.min(8, Math.max(1, Number(value) || 1));
    const plans = JSON.parse(localStorage.getItem("recipe-hopper-plans") || "{}");
    let cycleWeek = clampWeek(new URLSearchParams(location.search).get("week"));
    let recipes = [];
    let easy = [];
    let stretch = [];
    let checked = new Set();
    let latestGroceries = [];
    const breakfastBase = [
      {meal: "Apple-cinnamon oatmeal", ingredients: ["rolled oats", "milk", "Apples", "cinnamon"]},
      {meal: "Scrambled eggs & whole-grain toast", ingredients: ["Eggs", "whole-grain bread"]},
      null,
      {meal: "Greek yogurt, banana & oats", ingredients: ["Greek yogurt", "Bananas", "rolled oats"]},
      {meal: "Egg & cheese breakfast wrap", ingredients: ["Eggs", "shredded cheddar", "flour tortillas"]},
      null,
      {meal: "Peanut-butter banana oatmeal", ingredients: ["rolled oats", "milk", "Bananas", "peanut butter"]}
    ];
    const breakfastPlans = [
      {
        id: "berry-cocoa", name: "Berry + chocolate banana",
        first: {meal: "Berry-vanilla Whey smoothie + toast", ingredients: ["frozen mixed berries", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Chocolate-banana Whey smoothie + toast", ingredients: ["Bananas", "cocoa powder", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "mango-mocha", name: "Mango ginger + mocha banana",
        first: {meal: "Mango-ginger Whey smoothie + toast", ingredients: ["frozen mango", "fresh ginger", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Mocha-banana Whey smoothie + toast", ingredients: ["Bananas", "cocoa powder", "instant coffee", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "strawberry-peanut", name: "Strawberry oat + chocolate peanut",
        first: {meal: "Strawberry-oat Whey smoothie + toast", ingredients: ["frozen strawberries", "rolled oats", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Chocolate-peanut Whey smoothie + toast", ingredients: ["cocoa powder", "peanut butter", "Bananas", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "blueberry-peach", name: "Blueberry cinnamon + peach vanilla",
        first: {meal: "Blueberry-cinnamon Whey smoothie + toast", ingredients: ["frozen blueberries", "cinnamon", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Peach-vanilla Whey smoothie + toast", ingredients: ["frozen peaches", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "raspberry-banana", name: "Raspberry cocoa + banana cinnamon",
        first: {meal: "Raspberry-cocoa Whey smoothie + toast", ingredients: ["frozen raspberries", "cocoa powder", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Banana-cinnamon Whey smoothie + toast", ingredients: ["Bananas", "cinnamon", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "pineapple-cherry", name: "Pineapple vanilla + cherry cocoa",
        first: {meal: "Pineapple-vanilla Whey smoothie + toast", ingredients: ["frozen pineapple", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Cherry-cocoa Whey smoothie + toast", ingredients: ["frozen cherries", "cocoa powder", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "mixed-berry-coffee", name: "Mixed berry oat + coffee vanilla",
        first: {meal: "Mixed-berry oat Whey smoothie + toast", ingredients: ["frozen mixed berries", "rolled oats", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Coffee-vanilla Whey smoothie + toast", ingredients: ["instant coffee", "whey protein powder", "milk", "whole-grain bread"]}
      },
      {
        id: "apple-strawberry", name: "Apple cinnamon + strawberry cocoa",
        first: {meal: "Apple-cinnamon Whey smoothie + toast", ingredients: ["Apples", "cinnamon", "whey protein powder", "milk", "whole-grain bread"]},
        second: {meal: "Strawberry-cocoa Whey smoothie + toast", ingredients: ["frozen strawberries", "cocoa powder", "whey protein powder", "milk", "whole-grain bread"]}
      }
    ];
    const breakfastsFor = plan => breakfastBase.map((breakfast, index) =>
      index === 2 ? plan.first : index === 5 ? plan.second : breakfast
    );

    const save = () => {
      plans[cycleWeek] = {
        breakfast: breakfastSelect.value,
        a: mealA.value, b: mealB.value, checked: [...checked]
      };
      localStorage.setItem("recipe-hopper-plans", JSON.stringify(plans));
    };

    function option(recipe) {
      const node = document.createElement("option");
      node.value = recipe.path;
      node.textContent = difficulty(recipe) === "Stretch"
        ? `${recipe.title} — ${technique(recipe)}`
        : recipe.title;
      return node;
    }

    const difficulty = recipe => recipe.tags?.includes("stretch") ? "Stretch" : "Approachable";
    const technique = recipe => (recipe.tags?.find(tag => tag.startsWith("skill-")) || "skill-timing-and-seasoning")
      .slice(6).replaceAll("-", " ");
    const costScore = recipe => {
      const text = `${recipe.title} ${recipe.ingredients.join(" ")}`.toLowerCase();
      const staples = ["bean","lentil","chickpea","potato","rice","pasta","egg","carrot","frozen","canned","chicken thigh","ground "];
      const costly = ["lamb","tenderloin","sashimi","scallop","prosciutto","blue cheese","truffle","lobster","salmon"];
      return costly.filter(word => text.includes(word)).length * 4 - staples.filter(word => text.includes(word)).length;
    };
    const pantryStock = [
      /^(?:(?:coarse|fine|flaky|kosher|sea|table)\s+)*salt\b/i,
      /^(?:(?:freshly ground|ground) )?black pepper\b/i,
      /^pepper(?:,|$| to taste)/i,
      /^(white |brown |granulated |caster )?sugar\b/i,
      /^(all[- ]purpose |plain |bread )?flour(?:$|\s*[,;(])/i,
      /^(?:hot |cold |warm |boiling )?water\b/i,
      /^(?:(?:good-quality|regular|full-fat|light)\s+)?(?:mayonnaise|mayo)\b/i,
      /^(extra-virgin )?olive oil\b/i,
      /^(cooking|vegetable|canola) oil\b/i,
      /^oil(?:$| (?:for|to) )/i
    ];
    const aliases = [
      [/\bonions?\b/i, "Onions"],
      [/\bgarlic\b/i, "Garlic"],
      [/\bpotatoes?\b/i, "Potatoes"],
      [/\bcarrots?\b/i, "Carrots"],
      [/\bginger\b/i, "Ginger"],
      [/\b(cilantro|coriander)\b/i, "Cilantro"],
      [/\b(chilli|chile|chili)\b/i, "Chillies"],
      [/\bspinach\b/i, "Spinach"],
      [/\bcauliflower\b/i, "Cauliflower"],
      [/\bgreen beans?\b/i, "Green beans"],
      [/\basparagus\b/i, "Asparagus"],
      [/\bcoconut milk\b/i, "Coconut milk"],
      [/\bcurry powder\b/i, "Curry powder"],
      [/\bturmeric\b/i, "Turmeric"],
      [/^(large )?eggs?(?:,.*)?$/i, "Eggs"],
      [/\bchicken breasts?\b/i, "Chicken breasts"],
      [/\bchicken thighs?\b/i, "Chicken thighs"],
      [/\bground beef\b/i, "Ground beef"],
      [/\bparmesan\b/i, "Parmesan"],
      [/\bmozzarella\b/i, "Mozzarella"],
      [/\b(?:corn |flour )?taco shells?\b/i, "Taco shells"]
    ];
    const categoryRules = [
      ["Frozen", /\bfrozen\b/i],
      ["Produce", /\b(onions?|garlic|potatoes?|carrots?|broccoli|cauliflower|asparagus|green beans?|mushrooms?|zucchini|bell peppers?|green peppers?|red peppers?|yellow peppers?|orange peppers?|poblano|jalapeño|jalapeno|corn|spinach|lettuce|greens|tomatoes?|avocado|lemons?|limes?|basil|parsley|cilantro|ginger|chillies|cucumbers?|celery|apples?|bananas?|berries|mango|peaches?|pineapple|cherries)\b/i],
      ["Meat & seafood", /\b(chicken|beef|turkey|pork|sausage|shrimp|salmon|fish|lamb|prosciutto)\b/i],
      ["Dairy & eggs", /\b(eggs?|(?<!coconut )milk|cream|(?<!peanut )(?<!almond )butter|cheese|cheddar|parmesan|mozzarella|provolone|yogurt|feta)\b/i],
      ["Bakery", /\b(bread|buns?|rolls?|tortillas?|flatbreads?|pitas?|taco shells?)\b/i]
    ];
    const canonicalIngredient = item => {
      const cleaned = item.replace(/\([^)]*\)/g, "").replace(/\s+/g, " ").trim()
        .replace(/^to\s+\d+(?:\s+\d+\/\d+)?\s+(?:(?:ounces?|oz|pounds?|lbs?|cups?|teaspoons?|tsp|tablespoons?|tbsp)\s+)?/i, "")
        .replace(/^(?:cans?|packages?|heads?)\s+/i, "")
        .replace(/^(fresh|large|small|medium|chopped|diced|sliced|minced)\s+/i, "");
      const alias = aliases.find(([pattern]) => pattern.test(cleaned));
      return alias ? alias[1] : cleaned;
    };
    const groceryCategory = item => categoryRules.find(([, pattern]) => pattern.test(item))?.[0] || "Cans & dry goods";
    const escapeHTML = value => value.replace(/[&<>"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
    console.assert(pantryStock.some(pattern => pattern.test("olive oil")), "olive oil should be pantry stock");
    console.assert(pantryStock.some(pattern => pattern.test("coarse salt")), "salt variants should stay in pantry");
    console.assert(pantryStock.some(pattern => pattern.test("brown sugar ($0.12)")), "sugar notes should stay in pantry");
    console.assert(pantryStock.some(pattern => pattern.test("black pepper (freshly cracked)")), "black pepper notes should stay in pantry");
    console.assert(pantryStock.some(pattern => pattern.test("bread flour")), "bread flour should stay in pantry");
    console.assert(!pantryStock.some(pattern => pattern.test("flour tortillas")), "flour tortillas are not pantry flour");
    console.assert(pantryStock.some(pattern => pattern.test("warm water")), "water should stay in pantry");
    console.assert(pantryStock.some(pattern => pattern.test("good-quality mayonnaise")), "mayonnaise should stay in pantry");
    console.assert(!pantryStock.some(pattern => pattern.test("Pepper Jack Cheese")), "pepper jack is not black pepper");
    console.assert(clampWeek(0) === 1 && clampWeek(9) === 8, "week navigation should stay in range");
    console.assert(canonicalIngredient("chopped onion") === "Onions", "onion variants should merge");
    console.assert(canonicalIngredient("hard corn taco shells") === "Taco shells", "taco shells should merge");
    console.assert(canonicalIngredient("can light coconut milk") === "Coconut milk", "coconut milk variants should merge");
    console.assert(canonicalIngredient("to 10 ounces green beans or slender asparagus") === "Green beans", "range fragments should be removed");
    console.assert(breakfastPlans.length === 8, "each week should have a breakfast rotation");
    console.assert(breakfastPlans.every(plan =>
      breakfastsFor(plan).filter(day => day.meal.includes("Whey smoothie")).length === 2
      && plan.first.meal !== plan.second.meal
    ), "each rotation should have two distinct Whey smoothies");
    console.assert(groceryCategory("Chicken breasts") === "Meat & seafood", "chicken should be grouped as meat");
    console.assert(groceryCategory("Carrots") === "Produce", "plural produce should stay in produce");
    console.assert(groceryCategory("Cauliflower") === "Produce", "cauliflower should stay in produce");
    console.assert(groceryCategory("frozen mixed berries") === "Frozen", "frozen breakfast fruit should stay frozen");
    console.assert(groceryCategory("peanut butter") === "Cans & dry goods", "peanut butter is not dairy");
    console.assert(groceryCategory("flour tortillas") === "Bakery", "breakfast tortillas should stay in bakery");
    console.assert(groceryCategory("coconut milk") === "Cans & dry goods", "coconut milk is not dairy");
    console.assert(groceryCategory("cayenne pepper") === "Cans & dry goods", "ground spices are dry goods");

    function mealLink(recipe, label) {
      return `<a href="${root}${recipe.path}"><strong>${label}</strong><span>${recipe.title}</span></a>`;
    }

    function render() {
      const a = recipes.find(recipe => recipe.path === mealA.value);
      const b = recipes.find(recipe => recipe.path === mealB.value);
      const breakfastPlan = breakfastPlans.find(plan => plan.id === breakfastSelect.value) || breakfastPlans[0];
      const breakfastDays = breakfastsFor(breakfastPlan);
      if (!a || !b) return;
      skill.textContent = technique(b).replace(/\b\w/g, letter => letter.toUpperCase());
      batchNote.textContent = "Sunday: cook 5 portions of each. 10 weekday meals. Breakfast is made fresh daily.";
      week.innerHTML = days.map((day, index) => {
        const breakfast = `<div class="meal-slot breakfast-slot"><strong>Breakfast</strong><span>${escapeHTML(breakfastDays[index].meal)}</span></div>`;
        let lunch, dinner;
        if (day === "Sunday") {
          lunch = `<div class="takeout">Lunch · Takeout</div>`;
          dinner = `<div class="takeout">Dinner · Takeout</div>`;
        } else if (day === "Saturday") {
          lunch = `<div class="open-slot">Lunch · Open</div>`;
          dinner = `<div class="open-slot">Dinner · Open</div>`;
        } else {
          lunch = mealLink(a, "Lunch");
          dinner = mealLink(b, "Dinner");
        }
        return `<article class="day-card${day === "Sunday" ? " is-prep-day" : ""}"><h2>${day}</h2>${breakfast}<div class="meal-slot">${lunch}</div><div class="meal-slot">${dinner}</div></article>`;
      }).join("");

      const unique = new Map();
      [...a.ingredients, ...b.ingredients, ...breakfastDays.flatMap(day => day.ingredients)]
        .flatMap(item => item.replace(/^Accompaniments?:\s*/i, "").split(/\s*;\s*/))
        .map(item => item.trim())
        .filter(Boolean)
        .filter(item => !pantryStock.some(pattern => pattern.test(item.trim())))
        .forEach(item => {
          const label = canonicalIngredient(item);
          unique.set(label.toLowerCase(), label);
        });
      const grouped = [...unique.values()].reduce((result, item) => {
        (result[groceryCategory(item)] ||= []).push(item);
        return result;
      }, {});
      latestGroceries = ["Produce","Meat & seafood","Dairy & eggs","Bakery","Frozen","Cans & dry goods"]
        .filter(category => grouped[category]?.length)
        .map(category => [category, grouped[category].sort((x, y) => x.localeCompare(y))]);
      groceries.innerHTML = latestGroceries
        .map(([category, items]) => `<section class="grocery-group${items.length > 10 ? " is-long" : ""}"><h3>${category}</h3><ul>${
          items.map(item => {
            const key = encodeURIComponent(item.toLowerCase());
            return `<li><label><input type="checkbox" data-key="${key}" ${checked.has(key) ? "checked" : ""}> <span>${escapeHTML(item)}</span></label></li>`;
          }).join("")
        }</ul></section>`).join("");
      groceries.querySelectorAll("input").forEach(input => input.addEventListener("change", () => {
        input.checked ? checked.add(input.dataset.key) : checked.delete(input.dataset.key);
        updateGroceryProgress();
        save();
      }));
      updateGroceryProgress();
      save();
    }

    function updateGroceryProgress() {
      const boxes = [...groceries.querySelectorAll("input")];
      const done = boxes.filter(box => box.checked).length;
      groceryProgress.textContent = done
        ? `${done} of ${boxes.length} picked up`
        : `${boxes.length} items, organized by aisle`;
    }

    const breakfastSelect = document.getElementById("breakfast-plan");
    const mealA = document.getElementById("meal-a");
    const mealB = document.getElementById("meal-b");
    const week = document.getElementById("week");
    const groceries = document.getElementById("groceries");
    const batchNote = document.getElementById("batch-note");
    const skill = document.getElementById("skill");
    const groceryProgress = document.getElementById("grocery-progress");
    const reroll = document.getElementById("reroll");
    const cycle = document.getElementById("cycle");
    const cycleProgress = document.getElementById("cycle-progress");
    breakfastPlans.forEach(plan => {
      const node = document.createElement("option");
      node.value = plan.id;
      node.textContent = plan.name;
      breakfastSelect.append(node);
    });

    function renderWeekNav() {
      cycle.textContent = `Choose a week · ${cycleWeek} of 8`;
      cycleProgress.innerHTML = Array.from({length: 8}, (_, index) => {
        const number = index + 1;
        return `<button type="button" data-week="${number}" ${number === cycleWeek ? 'class="is-current" aria-current="step"' : ""}>Week ${number}</button>`;
      }).join("");
      cycleProgress.querySelectorAll("button").forEach(button =>
        button.addEventListener("click", () => loadWeek(button.dataset.week))
      );
    }

    function loadWeek(number) {
      cycleWeek = clampWeek(number);
      history.replaceState(null, "", `?week=${cycleWeek}`);
      const state = plans[cycleWeek] || {};
      checked = new Set(state.checked || []);
      breakfastSelect.value = breakfastPlans.some(plan => plan.id === state.breakfast)
        ? state.breakfast : breakfastPlans[(cycleWeek - 1) % breakfastPlans.length].id;
      mealA.value = easy.some(([recipe]) => recipe.path === state.a)
        ? state.a : easy[(cycleWeek - 1) % easy.length]?.[0].path;
      mealB.value = stretch.some(([recipe]) => recipe.path === state.b)
        ? state.b : (stretch[(cycleWeek - 1) % stretch.length]?.[0].path ?? easy[1]?.[0].path);
      renderWeekNav();
      render();
    }

    fetch(root + "static/search-index.json").then(response => response.json()).then(data => {
      recipes = data;
      const byCost = ([a], [b]) => costScore(a) - costScore(b);
      easy = data.map((recipe, index) => [recipe, index]).filter(([recipe]) => difficulty(recipe) === "Approachable").sort(byCost);
      stretch = data.map((recipe, index) => [recipe, index]).filter(([recipe]) => difficulty(recipe) === "Stretch").sort(byCost);
      easy.forEach(([recipe]) => {
        mealA.append(option(recipe));
      });
      (stretch.length ? stretch : easy).forEach(([recipe]) => {
        mealB.append(option(recipe));
      });
      [breakfastSelect, mealA, mealB].forEach(control => control.addEventListener("change", () => {
        checked.clear();
        render();
      }));
      reroll.addEventListener("click", () => {
        const pick = choices => choices[Math.floor(Math.random() * choices.length)]?.[0].path;
        const nextA = pick(easy);
        const nextB = pick(stretch.length ? stretch : easy);
        if (nextA) mealA.value = nextA;
        if (nextB) mealB.value = nextB;
        checked.clear();
        render();
      });
      loadWeek(cycleWeek);
    });

    document.getElementById("copy-groceries").addEventListener("click", async event => {
      const text = latestGroceries
        .map(([category, items]) => `${category}\n${items.map(item => `- ${item}`).join("\n")}`)
        .join("\n\n");
      try {
        await navigator.clipboard.writeText(text);
        event.currentTarget.textContent = "Copied";
      } catch {
        event.currentTarget.textContent = "Copy unavailable";
      }
      setTimeout(() => { event.currentTarget.textContent = "Copy list"; }, 1500);
    });
    document.getElementById("clear-groceries").addEventListener("click", () => {
      checked.clear();
      groceries.querySelectorAll("input").forEach(input => { input.checked = false; });
      updateGroceryProgress();
      save();
    });
  </script>
</body>
</html>
